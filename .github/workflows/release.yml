name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.2.0) — only needed when running this manually rather than from a tag push"
        required: false

permissions:
  contents: read

jobs:
  # Creates the single draft release up front so the three build jobs below
  # all upload into it. Left to tauri-action, each matrix job looks up the
  # release and creates it if missing, and two jobs finishing together can
  # each create their own draft, splitting the installers across them.
  # Reuses an existing release for the tag, so re-running the workflow
  # doesn't make a second one. Draft means nothing goes public until a
  # human reviews and publishes it from the Releases tab.
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | "\(.id) \(.tag_name)"' \
            | awk -v tag="$TAG" '$2 == tag { print $1; exit }')
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Butterdrive $TAG" \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    # tauri-action uploads each platform's installers to the release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: windows
            os: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform.os }}
    steps:
      # Nothing here needs git credentials, so don't leave the write-scoped
      # token on disk where npm or Cargo build scripts could read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and attach to draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.platform.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
