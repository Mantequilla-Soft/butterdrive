[package]
name = "sync-core"
version = "0.1.0"
edition.workspace = true

[lib]
name = "sync_core"

[dependencies]
aws-config = "1.13.0"
aws-sdk-s3 = "1.155.0"
aws-smithy-runtime-api = "1.19.1"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
notify = "8.2.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
walkdir = "2.5.0"
